name: Refresh profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/profile-sync.yml'

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate live profile assets
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: amirtahanemati
        run: node scripts/generate-profile.mjs

      - name: Commit refreshed dashboard
        run: |
          git config user.name "amirtaha-profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated/
          if git diff --cached --quiet; then
            echo "Profile already up to date."
            exit 0
          fi
          git commit -m "chore: refresh live profile dashboard"
          git push
