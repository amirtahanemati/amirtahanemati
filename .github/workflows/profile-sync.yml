name: Refresh premium profile

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/profile-sync.yml'

permissions:
  contents: write

concurrency:
  group: premium-profile-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            generated/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#BFFF35&color_dots=#0A0A0A,#1B270C,#334F0C,#689F13,#BFFF35
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate live dashboard and repository cards
        env:
          PROFILE_USERNAME: amirtahanemati
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-profile.mjs

      - name: Commit refreshed profile
        run: |
          git config user.name "amirtaha-profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated/
          if git diff --cached --quiet; then
            echo "Profile already up to date."
            exit 0
          fi
          git commit -m "chore: refresh premium profile [skip ci]"
          git push
