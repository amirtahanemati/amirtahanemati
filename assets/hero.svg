    <circle cx="22" cy="22" r="5" fill="#FF6E6E"/><circle cx="40" cy="22" r="5" fill="#FFD65A"/><circle cx="58" cy="22" r="5" fill="#79E86D"/>
    <text x="22" y="61" fill="#71716B" font-family="monospace" font-size="11">stack.py</text>
    <text x="22" y="95" fill="#BFFF35" font-family="monospace" font-size="14">class</text>
    <text x="72" y="95" fill="#F1F1EC" font-family="monospace" font-size="14">Amirtaha:</text>
    <text x="38" y="128" fill="#81817B" font-family="monospace" font-size="13">main</text><text x="96" y="128" fill="#F1F1EC" font-family="monospace" font-size="13">= ["Python", "FastAPI"]</text>
